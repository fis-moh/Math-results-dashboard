<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحليل نتائج الرياضيات - ثانوية نعام</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b1329;
            --glass-bg: rgba(22, 36, 68, 0.7);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --success: #10b981;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a 60%, #050814 100%);
            color: var(--text-main);
            margin: 0;
            padding: 24px 16px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background: var(--glass-bg);
            border-radius: 18px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        .header h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            color: #60a5fa;
            letter-spacing: -0.5px;
        }
        .header p {
            margin: 0;
            font-size: 15px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 12px 24px;
            border-radius: 14px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            font-size: 15px;
            font-weight: 600;
            transition: all 0.25s ease;
        }
        .tab-btn.active {
            background: var(--accent);
            border-color: #60a5fa;
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 18px;
            border-radius: 16px;
            text-align: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .stat-card h3 {
            margin: 0 0 8px 0;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .stat-card p {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            color: #38bdf8;
        }
        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        .chart-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 20px;
            border-radius: 18px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .table-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: center;
        }
        th, td {
            padding: 14px 10px;
            border-bottom: 1px solid var(--glass-border);
            font-size: 14px;
        }
        th {
            color: var(--text-muted);
            font-weight: 600;
            background: rgba(15, 23, 42, 0.4);
        }
        tbody tr:last-child td {
            border-bottom: none;
        }
        td.student-name {
            text-align: right;
            font-weight: 600;
        }
        .perfect-score { background-color: rgba(16, 185, 129, 0.18); color: #34d399; font-weight: 700; }
        .low-score { background-color: rgba(239, 68, 68, 0.2); color: #f87171; font-weight: 700; }
        @media (max-width: 800px) {
            .charts-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>لوحة تحليل نتائج الرياضيات - ثانوية نعام</h1>
        <p>المعلم: فيصل محمد مدخلي | مدير المدرسة: زيد الداود</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchClass('class1', this)">أول ثانوي</button>
        <button class="tab-btn" onclick="switchClass('class2', this)">ثاني ثانوي</button>
        <button class="tab-btn" onclick="switchClass('class3', this)">ثالث ثانوي</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><h3>عدد الطلاب</h3><p id="total-students">-</p></div>
        <div class="stat-card"><h3>متوسط المجموع العام</h3><p id="avg-total">-</p></div>
        <div class="stat-card"><h3>متوسط الاختبار (من 20)</h3><p id="avg-exam">-</p></div>
        <div class="stat-card"><h3>نسبة التفوق (60/60)</h3><p id="perfect-ratio">-</p></div>
    </div>

    <div class="charts-container">
        <div class="chart-box">
            <canvas id="barChart"></canvas>
        </div>
        <div class="chart-box">
            <canvas id="radarChart"></canvas>
        </div>
    </div>

    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th style="text-align: right;">اسم الطالب</th>
                    <th>المشاركة (10)</th>
                    <th>الواجبات (10)</th>
                    <th>المهام (10)</th>
                    <th>المشروع (10)</th>
                    <th>الاختبار (20)</th>
                    <th>المجموع (60)</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
const classesData = {
    class1: [
        {name: 'البراء بن عبد الرحمن شديد', p1:10, p2:10, p3:10, p4:10, p5:20, total:60},
        {name: 'خالد سعد سعيد الأحمري', p1:5, p2:4, p3:10, p4:9, p5:10, total:38},
        {name: 'زياد بن تركي الضفيان', p1:8, p2:9, p3:10, p4:9, p5:14, total:50},
        {name: 'سعد بن خالد بن جميد', p1:10, p2:10, p3:10, p4:10, p5:20, total:60},
        {name: 'سعد بن سلمان القريني', p1:10, p2:10, p3:10, p4:10, p5:20, total:60},
        {name: 'سعد بن عبد الله الحميدان', p1:6, p2:10, p3:10, p4:10, p5:8, total:44},
        {name: 'سعود بن عبد العزيز آل هلال', p1:10, p2:10, p3:10, p4:10, p5:20, total:60},
        {name: 'عامر بن عبد الله الذواد', p1:9, p2:10, p3:10, p4:10, p5:16, total:55},
        {name: 'عبد العزيز بن يحيى اليحيى', p1:10, p2:10, p3:10, p4:10, p5:20, total:60},
        {name: 'عبد الله بن علي المطيري', p1:9, p2:7, p3:10, p4:8, p5:17, total:51},
        {name: 'عبد الملك بن تركي الضفيان', p1:7, p2:9, p3:10, p4:7, p5:14, total:47},
        {name: 'محمد بن راجح العجمي', p1:8, p2:6, p3:10, p4:0, p5:16, total:40},
        {name: 'محمد بن سعود آل عثمان', p1:10, p2:10, p3:10, p4:9, p5:20, total:59},
        {name: 'ناصر بن عبد الرحمن ابو سلمان', p1:5, p2:7, p3:10, p4:0, p5:4, total:26}
    ],
    class2: [
        {name: 'انس مشارى آل مشاری', p1:8, p2:7, p3:10, p4:10, p5:14, total:49},
        {name: 'ابراهیم زید أبو حبيش', p1:8, p2:10, p3:10, p4:9, p5:10, total:47},
        {name: 'بدر فهد ال مهيدي', p1:10, p2:10, p3:10, p4:10, p5:20, total:60},
        {name: 'تميم عبد الله التميمي', p1:8, p2:5, p3:10, p4:6, p5:4, total:33},
        {name: 'راشد ماجد آل ماجد', p1:5, p2:2, p3:10, p4:0, p5:12, total:29},
        {name: 'سالم مبارك الحميدان', p1:10, p2:9, p3:10, p4:9, p5:16, total:54},
        {name: 'سعود سامي بن ضويان', p1:10, p2:10, p3:10, p4:10, p5:20, total:60},
        {name: 'سلمان محمد القريني', p1:7, p2:9, p3:7, p4:9, p5:4, total:36},
        {name: 'عبد العزيز سعد بن ضويان', p1:9, p2:10, p3:10, p4:9, p5:10, total:48},
        {name: 'عبد العزيز سعود العجلان', p1:8, p2:9, p3:10, p4:9, p5:6, total:42},
        {name: 'عبد العزيز عبد الرحمن البقمي', p1:10, p2:5, p3:10, p4:9, p5:14, total:48},
        {name: 'عبد الله معلوي آل الذيب', p1:9, p2:7, p3:10, p4:9, p5:20, total:55},
        {name: 'عزام محمد العجلان', p1:10, p2:9, p3:10, p4:10, p5:20, total:59},
        {name: 'محمد رشید ابورشید', p1:10, p2:9, p3:10, p4:10, p5:17, total:56},
        {name: 'محمد سعد العبودي', p1:7, p2:2, p3:8, p4:0, p5:11, total:28},
        {name: 'محمد سعد المهيدي', p1:8, p2:10, p3:8, p4:9, p5:5, total:40},
        {name: 'محمد هزان العثمان', p1:10, p2:10, p3:10, p4:10, p5:20, total:60},
        {name: 'نواف سعود الحركان', p1:10, p2:9, p3:10, p4:10, p5:17, total:56}
    ],
    class3: [
        {name: 'بندر بن عايض الاحمري', p1:5, p2:5, p3:10, p4:8, p5:5, total:33},
        {name: 'ثامر بن علي المطيري', p1:5, p2:10, p3:9, p4:6, p5:10, total:40},
        {name: 'حاتم بن سعد الاحمري', p1:5, p2:9, p3:8, p4:9, p5:11, total:42},
        {name: 'خالد بن عبد الله بن دريس', p1:10, p2:10, p3:10, p4:10, p5:20, total:60},
        {name: 'خالد بن محمد العنزي', p1:10, p2:10, p3:10, p4:10, p5:20, total:60},
        {name: 'ریان بن فهد ال مسعود', p1:5, p2:9, p3:10, p4:9, p5:9, total:42},
        {name: 'ريان بن محمد الشبانات', p1:10, p2:4, p3:10, p4:9, p5:17, total:50},
        {name: 'زياد بن سلمان القريني', p1:5, p2:10, p3:10, p4:9, p5:7, total:41},
        {name: 'سعد بن منصور الضويان', p1:10, p2:9, p3:10, p4:7, p5:13, total:49},
        {name: 'سلطان بن فهد العتيبي', p1:10, p2:10, p3:10, p4:10, p5:20, total:60},
        {name: 'عبد العزيز بن عبد الله الحميدان', p1:5, p2:9, p3:9, p4:9, p5:4, total:36},
        {name: 'عبد الله بن ابراهيم الحميدان', p1:7, p2:10, p3:10, p4:9, p5:7, total:43},
        {name: 'عبد الله بن عبد العزيز آل مشاري', p1:7, p2:9, p3:10, p4:9, p5:11, total:46},
        {name: 'فارس بن مبارك الحميدان', p1:7, p2:5, p3:10, p4:9, p5:10, total:41},
        {name: 'محمد بن عبد العزيز التميمي', p1:5, p2:10, p3:8, p4:9, p5:10, total:42},
        {name: 'مشعل بن خالد البقمي', p1:10, p2:9, p3:10, p4:9, p5:18, total:56}
    ]
};

let barChart, radarChart;

function cellFormat(val, max) {
    if (val === max) return `<td class="perfect-score">${val}</td>`;
    if (val <= max / 2) return `<td class="low-score">${val}</td>`;
    return `<td>${val}</td>`;
}

function switchClass(classId, btnElement) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    if (btnElement) btnElement.classList.add('active');

    const data = classesData[classId];
    const tbody = document.querySelector('#dataTable tbody');
    tbody.innerHTML = '';
    
    let sumTotal = 0, sumExam = 0, perfectCount = 0;
    let sumP1 = 0, sumP2 = 0, sumP3 = 0, sumP4 = 0;

    data.forEach(s => {
        sumTotal += s.total;
        sumExam += s.p5;
        sumP1 += s.p1; sumP2 += s.p2; sumP3 += s.p3; sumP4 += s.p4;
        if(s.total === 60) perfectCount++;

        tbody.innerHTML += `
            <tr>
                <td class="student-name">${s.name}</td>
                ${cellFormat(s.p1, 10)}
                ${cellFormat(s.p2, 10)}
                ${cellFormat(s.p3, 10)}
                ${cellFormat(s.p4, 10)}
                ${cellFormat(s.p5, 20)}
                ${cellFormat(s.total, 60)}
            </tr>
        `;
    });

    const count = data.length;
    document.getElementById('total-students').innerText = count;
    document.getElementById('avg-total').innerText = (sumTotal / count).toFixed(1);
    document.getElementById('avg-exam').innerText = (sumExam / count).toFixed(1);
    document.getElementById('perfect-ratio').innerText = ((perfectCount / count) * 100).toFixed(0) + '%';

    renderCharts(data, sumP1/count, sumP2/count, sumP3/count, sumP4/count, (sumExam/count)/2);
}

function renderCharts(data, a1, a2, a3, a4, a5) {
    const names = data.map(d => d.name.split(' ')[0] + ' ' + (d.name.split(' ')[1] || ''));
    const totals = data.map(d => d.total);

    if (barChart) barChart.destroy();
    if (radarChart) radarChart.destroy();

    const ctxBar = document.getElementById('barChart').getContext('2d');
    barChart = new Chart(ctxBar, {
        type: 'bar',
        data: {
            labels: names,
            datasets: [{
                label: 'المجموع الكلي للطلاب',
                data: totals,
                backgroundColor: 'rgba(59, 130, 246, 0.75)',
                borderColor: '#3b82f6',
                borderWidth: 1,
                borderRadius: 6
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: { beginAtZero: true, max: 60, grid: { color: 'rgba(255, 255, 255, 0.08)' }, ticks: { color: '#94a3b8' } },
                x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 10 } } }
            },
            plugins: { legend: { labels: { color: '#f8fafc', font: { family: 'Segoe UI' } } } }
        }
    });

    const ctxRadar = document.getElementById('radarChart').getContext('2d');
    radarChart = new Chart(ctxRadar, {
        type: 'radar',
        data: {
            labels: ['المشاركة', 'الواجبات', 'المهام الأدائية', 'المشروع', 'الاختبار (محول لـ 10)'],
            datasets: [{
                label: 'متوسط الأداء العام للمعيار',
                data: [a1, a2, a3, a4, a5],
                backgroundColor: 'rgba(16, 185, 129, 0.25)',
                borderColor: '#10b981',
                pointBackgroundColor: '#10b981',
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            scales: {
                r: {
                    beginAtZero: true,
                    max: 10,
                    ticks: { display: false },
                    grid: { color: 'rgba(255, 255, 255, 0.1)' },
                    angleLines: { color: 'rgba(255, 255, 255, 0.1)' },
                    pointLabels: { color: '#f8fafc', font: { size: 12, weight: 'bold' } }
                }
            },
            plugins: { legend: { labels: { color: '#f8fafc', font: { family: 'Segoe UI' } } } }
        }
    });
}

window.onload = () => switchClass('class1', document.querySelector('.tab-btn'));
</script>

</body>
</html>
